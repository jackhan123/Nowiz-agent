<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI产品生成器 - Newiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .typing-effect {
            overflow: hidden;
            white-space: nowrap;
            animation: typing 2s steps(40, end);
        }
        
        @keyframes fanRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .fan-running {
            animation: fanRotate 0.5s linear infinite;
        }
        
        .status-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .led-on {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        
        .led-off {
            background-color: #374151;
        }

        .thinking-dots span {
            animation: thinking 1.4s ease-in-out infinite;
        }
        
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0s; }
        
        @keyframes thinking {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden">
    <div class="flex h-full">
        <!-- 左侧输入区域 - 25% -->
        <div class="w-1/4 bg-gray-800 border-r border-gray-700 p-6 flex flex-col">
            <div class="mb-8">
                <h1 class="text-2xl font-bold mb-2">AI产品生成器</h1>
                <p class="text-gray-400 text-sm">将你的想法转化为现实</p>
            </div>

            <!-- 硬件状态 -->
            <div class="mb-8">
                <div class="bg-gray-700 rounded-lg p-4">
                    <div class="flex items-center mb-3">
                        <div id="hardwareStatus" class="status-led led-green pulse-animation mr-2"></div>
                        <span class="font-semibold">硬件状态</span>
                    </div>
                    <p id="hardwareStatusText" class="text-sm text-gray-300">树莓派已就绪</p>
                </div>
            </div>

            <!-- 硬件就绪按钮 -->
            <div class="flex-1 flex items-center justify-center">
                <button id="startBtn" class="w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 rounded-lg transition-all transform hover:scale-105 shadow-lg">
                    <div class="flex items-center justify-center">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <span class="font-semibold">硬件已就绪</span>
                    </div>
                </button>
            </div>

            <!-- 快速示例 -->
            <div class="mt-8">
                <p class="text-sm text-gray-400 mb-3">快速示例:</p>
                <div class="space-y-2">
                    <button class="example-btn w-full text-left px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition-colors">
                        "手势控制的风扇"
                    </button>
                    <button class="example-btn w-full text-left px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition-colors">
                        "智能台灯"
                    </button>
                    <button class="example-btn w-full text-left px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition-colors">
                        "语音助手"
                    </button>
                </div>
            </div>
        </div>

        <!-- 右侧实现区域 - 75% -->
        <div class="w-3/4 bg-gray-900 p-6 overflow-y-auto">
            <!-- 初始状态 -->
            <div id="initialState" class="h-full flex items-center justify-center">
                <div class="text-center">
                    <div class="mb-8">
                        <div class="w-32 h-32 mx-auto mb-4 bg-gray-800 rounded-full flex items-center justify-center">
                            <svg class="w-16 h-16 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-bold mb-2">准备好创造你的产品</h2>
                        <p class="text-gray-400">点击"硬件已就绪"开始，AI将帮你实现任何想法</p>
                    </div>
                </div>
            </div>

            <!-- AI思考状态 -->
            <div id="thinkingState" class="hidden fade-in">
                <div class="flex flex-col items-center justify-center h-full">
                    <div class="mb-8">
                        <div class="thinking-dots flex space-x-2">
                            <span class="w-4 h-4 bg-blue-500 rounded-full"></span>
                            <span class="w-4 h-4 bg-blue-500 rounded-full"></span>
                            <span class="w-4 h-4 bg-blue-500 rounded-full"></span>
                        </div>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">AI正在分析你的需求</h3>
                    <p id="thinkingText" class="text-gray-400">理解用户意图...</p>
                    <div class="mt-6 bg-gray-800 rounded-lg p-4 max-w-md">
                        <div class="text-sm text-gray-400 mb-2">分析步骤:</div>
                        <div id="analysisSteps" class="space-y-2 text-sm">
                            <div class="flex items-center">
                                <span class="w-2 h-2 bg-gray-600 rounded-full mr-2"></span>
                                <span>解析自然语言</span>
                            </div>
                            <div class="flex items-center">
                                <span class="w-2 h-2 bg-gray-600 rounded-full mr-2"></span>
                                <span>识别硬件需求</span>
                            </div>
                            <div class="flex items-center">
                                <span class="w-2 h-2 bg-gray-600 rounded-full mr-2"></span>
                                <span>生成控制逻辑</span>
                            </div>
                            <div class="flex items-center">
                                <span class="w-2 h-2 bg-gray-600 rounded-full mr-2"></span>
                                <span>创建用户界面</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 生成结果状态 -->
            <div id="resultState" class="hidden fade-in">
                <!-- 产品信息头部 -->
                <div class="mb-6 bg-gray-800 rounded-lg p-6">
                    <div class="flex items-start justify-between">
                        <div>
                            <h2 id="productName" class="text-2xl font-bold mb-2">产品名称</h2>
                            <p id="productDescription" class="text-gray-400">产品描述</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="status-led led-green"></div>
                            <span class="text-sm text-green-400">生成完成</span>
                        </div>
                    </div>
                </div>

                <!-- 控制界面 -->
                <div id="controlInterface" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- 控制面板 -->
                    <div class="bg-gray-800 rounded-lg p-6">
                        <h3 class="text-lg font-semibold mb-4">控制面板</h3>
                        <div id="controlContent">
                            <!-- 动态生成控制内容 -->
                        </div>
                    </div>

                    <!-- 状态监控 -->
                    <div class="bg-gray-800 rounded-lg p-6">
                        <h3 class="text-lg font-semibold mb-4">状态监控</h3>
                        <div id="statusContent">
                            <!-- 动态生成状态内容 -->
                        </div>
                    </div>
                </div>

                <!-- 技术信息 -->
                <div class="mt-6 bg-gray-800 rounded-lg p-6">
                    <h3 class="text-lg font-semibold mb-4">技术实现</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <h4 class="text-sm text-gray-400 mb-2">硬件需求</h4>
                            <div id="hardwareList" class="text-sm">
                                <!-- 动态生成硬件列表 -->
                            </div>
                        </div>
                        <div>
                            <h4 class="text-sm text-gray-400 mb-2">控制方式</h4>
                            <div id="controlMethod" class="text-sm">
                                <!-- 动态生成控制方式 -->
                            </div>
                        </div>
                        <div>
                            <h4 class="text-sm text-gray-400 mb-2">API调用</h4>
                            <div id="apiInfo" class="text-sm">
                                <!-- 动态生成API信息 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 输入对话框 -->
    <div id="inputDialog" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4 fade-in">
            <h3 class="text-xl font-semibold mb-4">说出你要制造的产品吧</h3>
            <p class="text-gray-400 text-sm mb-6">AI将理解你的想法并生成完整的产品方案</p>
            
            <textarea 
                id="userInput" 
                class="w-full h-32 px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:border-blue-500 focus:outline-none resize-none text-white"
                placeholder="例如：我要做一个手势控制的风扇..."
            ></textarea>
            
            <div class="flex justify-end space-x-3 mt-6">
                <button id="cancelBtn" class="px-6 py-2 bg-gray-600 hover:bg-gray-700 rounded-lg transition-colors">
                    取消
                </button>
                <button id="generateBtn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors font-semibold">
                    生成产品
                </button>
            </div>
        </div>
    </div>

    <script>
        // 阿里云API配置
        const ALIYUN_CONFIG = {
            apiKey: '', // 从环境变量或配置中获取
            endpoint: 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation'
        };

        // DOM元素
        const elements = {
            startBtn: document.getElementById('startBtn'),
            inputDialog: document.getElementById('inputDialog'),
            cancelBtn: document.getElementById('cancelBtn'),
            generateBtn: document.getElementById('generateBtn'),
            userInput: document.getElementById('userInput'),
            initialState: document.getElementById('initialState'),
            thinkingState: document.getElementById('thinkingState'),
            resultState: document.getElementById('resultState'),
            thinkingText: document.getElementById('thinkingText'),
            analysisSteps: document.getElementById('analysisSteps'),
            productName: document.getElementById('productName'),
            productDescription: document.getElementById('productDescription'),
            controlContent: document.getElementById('controlContent'),
            statusContent: document.getElementById('statusContent'),
            hardwareList: document.getElementById('hardwareList'),
            controlMethod: document.getElementById('controlMethod'),
            apiInfo: document.getElementById('apiInfo'),
            hardwareStatus: document.getElementById('hardwareStatus'),
            hardwareStatusText: document.getElementById('hardwareStatusText')
        };

        // 事件监听器
        elements.startBtn.addEventListener('click', showInputDialog);
        elements.cancelBtn.addEventListener('click', hideInputDialog);
        elements.generateBtn.addEventListener('click', generateProduct);

        // 快速示例按钮
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                elements.userInput.value = btn.textContent.trim().replace(/"/g, '');
                showInputDialog();
            });
        });

        // 显示输入对话框
        function showInputDialog() {
            elements.inputDialog.classList.remove('hidden');
            elements.inputDialog.classList.add('flex');
            elements.userInput.focus();
        }

        // 隐藏输入对话框
        function hideInputDialog() {
            elements.inputDialog.classList.add('hidden');
            elements.inputDialog.classList.remove('flex');
            elements.userInput.value = '';
        }

        // 生成产品
        async function generateProduct() {
            const userInput = elements.userInput.value.trim();
            if (!userInput) {
                elements.userInput.classList.add('border-red-500');
                setTimeout(() => {
                    elements.userInput.classList.remove('border-red-500');
                }, 2000);
                return;
            }

            hideInputDialog();
            showThinkingState();

            try {
                // 解析用户输入
                const analysisResult = await analyzeUserInput(userInput);
                
                // 显示生成结果
                showResult(analysisResult);
            } catch (error) {
                console.error('生成失败:', error);
                alert('生成失败，请重试');
                resetToInitialState();
            }
        }

        // 分析用户输入
        async function analyzeUserInput(userInput) {
            // 模拟AI分析过程
            await sleep(1500);
            updateThinkingText('识别产品类型...');
            
            await sleep(1000);
            updateAnalysisStep(0, true);
            
            await sleep(1000);
            updateThinkingText('分析硬件需求...');
            
            await sleep(1000);
            updateAnalysisStep(1, true);
            
            await sleep(1000);
            updateThinkingText('生成控制逻辑...');
            
            await sleep(1000);
            updateAnalysisStep(2, true);
            
            await sleep(1000);
            updateThinkingText('创建用户界面...');
            
            await sleep(1000);
            updateAnalysisStep(3, true);
            updateThinkingText('完成！');

            // 分析用户输入并返回产品配置
            return analyzeProductRequirements(userInput);
        }

        // 分析产品需求
        function analyzeProductRequirements(userInput) {
            const input = userInput.toLowerCase();
            
            // 手势控制相关
            if (input.includes('手势') || input.includes('hand')) {
                return {
                    type: 'gesture_control',
                    product: '手势控制风扇',
                    description: '通过手势识别控制风扇的开关和转速',
                    hardware: ['树莓派', '摄像头', '继电器模块', '直流风扇'],
                    controlMethod: '手势识别',
                    features: ['开启风扇', '关闭风扇', '调速控制']
                };
            }
            
            // 智能台灯相关
            if (input.includes('台灯') || input.includes('灯') || input.includes('lamp')) {
                return {
                    type: 'smart_lamp',
                    product: '智能台灯',
                    description: '可调节亮度和色温的智能台灯',
                    hardware: ['树莓派', 'LED灯带', '光敏传感器', '按钮'],
                    controlMethod: '按钮控制',
                    features: ['开关控制', '亮度调节', '色温调节']
                };
            }
            
            // 语音助手相关
            if (input.includes('语音') || input.includes('声音') || input.includes('assistant')) {
                return {
                    type: 'voice_assistant',
                    product: '语音助手',
                    description: '支持语音命令的智能助手',
                    hardware: ['树莓派', '麦克风', '扬声器', 'LED指示灯'],
                    controlMethod: '语音控制',
                    features: ['语音识别', '语音合成', '状态反馈']
                };
            }
            
            // 默认返回手势控制风扇
            return {
                type: 'gesture_control',
                product: '手势控制设备',
                description: '基于手势识别的智能控制设备',
                hardware: ['树莓派', '摄像头', '传感器', '执行器'],
                controlMethod: '手势识别',
                features: ['开启设备', '关闭设备', '状态监控']
            };
        }

        // 显示思考状态
        function showThinkingState() {
            elements.initialState.classList.add('hidden');
            elements.resultState.classList.add('hidden');
            elements.thinkingState.classList.remove('hidden');
            
            // 重置分析步骤
            document.querySelectorAll('#analysisSteps .w-2').forEach(dot => {
                dot.classList.remove('bg-green-500');
                dot.classList.add('bg-gray-600');
            });
        }

        // 更新思考文本
        function updateThinkingText(text) {
            elements.thinkingText.textContent = text;
        }

        // 更新分析步骤
        function updateAnalysisStep(index, completed) {
            const dots = document.querySelectorAll('#analysisSteps .w-2');
            if (dots[index]) {
                if (completed) {
                    dots[index].classList.remove('bg-gray-600');
                    dots[index].classList.add('bg-green-500');
                }
            }
        }

        // 显示结果
        function showResult(analysisResult) {
            elements.thinkingState.classList.add('hidden');
            elements.resultState.classList.remove('hidden');
            
            // 更新产品信息
            elements.productName.textContent = analysisResult.product;
            elements.productDescription.textContent = analysisResult.description;
            
            // 生成控制界面
            generateControlInterface(analysisResult);
            
            // 生成状态监控
            generateStatusMonitoring(analysisResult);
            
            // 生成技术信息
            generateTechnicalInfo(analysisResult);
        }

        // 生成控制界面
        function generateControlInterface(analysisResult) {
            let controlHTML = '';
            
            switch(analysisResult.type) {
                case 'gesture_control':
                    controlHTML = `
                        <div class="space-y-4">
                            <div class="bg-gray-700 rounded-lg p-4">
                                <div class="flex items-center justify-between mb-3">
                                    <span class="font-semibold">手势控制</span>
                                    <div class="status-led led-green"></div>
                                </div>
                                <div class="mb-4">
                                    <div class="w-full h-32 bg-black rounded flex items-center justify-center">
                                        <div class="text-center text-gray-500">
                                            <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                            </svg>
                                            <p>摄像头预览</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="simulateGesture('on')" class="px-3 py-2 bg-green-600 hover:bg-green-700 rounded text-sm">
                                        👍 开启
                                    </button>
                                    <button onclick="simulateGesture('off')" class="px-3 py-2 bg-red-600 hover:bg-red-700 rounded text-sm">
                                        ✋ 关闭
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'smart_lamp':
                    controlHTML = `
                        <div class="space-y-4">
                            <div class="bg-gray-700 rounded-lg p-4">
                                <div class="flex items-center justify-between mb-3">
                                    <span class="font-semibold">灯光控制</span>
                                    <div class="status-led led-yellow"></div>
                                </div>
                                <div class="space-y-3">
                                    <div>
                                        <label class="text-sm text-gray-400">开关</label>
                                        <button onclick="toggleLamp()" class="w-full px-4 py-2 bg-yellow-600 hover:bg-yellow-700 rounded">
                                            切换开关
                                        </button>
                                    </div>
                                    <div>
                                        <label class="text-sm text-gray-400">亮度调节</label>
                                        <input type="range" min="0" max="100" value="50" class="w-full" onchange="adjustBrightness(this.value)">
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'voice_assistant':
                    controlHTML = `
                        <div class="space-y-4">
                            <div class="bg-gray-700 rounded-lg p-4">
                                <div class="flex items-center justify-between mb-3">
                                    <span class="font-semibold">语音控制</span>
                                    <div class="status-led led-blue"></div>
                                </div>
                                <div class="text-center py-8">
                                    <div class="w-20 h-20 mx-auto mb-4 bg-gray-600 rounded-full flex items-center justify-center">
                                        <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                                        </svg>
                                    </div>
                                    <button onclick="startVoiceRecording()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded">
                                        开始录音
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
            }
            
            elements.controlContent.innerHTML = controlHTML;
        }

        // 生成状态监控
        function generateStatusMonitoring(analysisResult) {
            let statusHTML = '';
            
            if (analysisResult.type === 'gesture_control') {
                statusHTML = `
                    <div class="space-y-4">
                        <div class="bg-gray-700 rounded-lg p-4">
                            <div class="flex items-center justify-between mb-3">
                                <span class="font-semibold">设备状态</span>
                                <div id="deviceStatusLED" class="status-led led-off"></div>
                            </div>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between">
                                    <span class="text-gray-400">运行状态:</span>
                                    <span id="deviceStatus">已停止</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">识别手势:</span>
                                    <span id="detectedGesture">--</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">响应时间:</span>
                                    <span>250ms</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                statusHTML = `
                    <div class="space-y-4">
                        <div class="bg-gray-700 rounded-lg p-4">
                            <div class="flex items-center justify-between mb-3">
                                <span class="font-semibold">系统状态</span>
                                <div class="status-led led-green"></div>
                            </div>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between">
                                    <span class="text-gray-400">连接状态:</span>
                                    <span class="text-green-400">已连接</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">CPU使用率:</span>
                                    <span>15%</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">内存使用:</span>
                                    <span>256MB</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            elements.statusContent.innerHTML = statusHTML;
        }

        // 生成技术信息
        function generateTechnicalInfo(analysisResult) {
            elements.hardwareList.innerHTML = analysisResult.hardware.map(item => 
                `<div class="flex items-center"><span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>${item}</div>`
            ).join('');
            
            elements.controlMethod.innerHTML = `
                <div class="flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>${analysisResult.controlMethod}</div>
                ${analysisResult.features.map(feature => 
                    `<div class="flex items-center text-gray-400 mt-1"><span class="w-1 h-1 bg-gray-500 rounded-full mr-2"></span>${feature}</div>`
                ).join('')}
            `;
            
            elements.apiInfo.innerHTML = `
                <div class="flex items-center"><span class="w-2 h-2 bg-purple-500 rounded-full mr-2"></span>阿里云Qwen API</div>
                <div class="flex items-center text-gray-400 mt-1"><span class="w-1 h-1 bg-gray-500 rounded-full mr-2"></span>自然语言理解</div>
                <div class="flex items-center text-gray-400 mt-1"><span class="w-1 h-1 bg-gray-500 rounded-full mr-2"></span>控制逻辑生成</div>
            `;
        }

        // 控制函数
        function simulateGesture(action) {
            const deviceStatusLED = document.getElementById('deviceStatusLED');
            const deviceStatus = document.getElementById('deviceStatus');
            const detectedGesture = document.getElementById('detectedGesture');
            
            if (action === 'on') {
                deviceStatusLED.classList.remove('led-off');
                deviceStatusLED.classList.add('led-green');
                deviceStatus.textContent = '运行中';
                detectedGesture.textContent = '👍 点赞';
            } else {
                deviceStatusLED.classList.remove('led-green');
                deviceStatusLED.classList.add('led-off');
                deviceStatus.textContent = '已停止';
                detectedGesture.textContent = '✋ 张开手掌';
            }
            
            // 模拟发送到树莓派
            sendToRaspberryPi('fan', action);
        }

        function toggleLamp() {
            alert('台灯控制功能演示');
        }

        function adjustBrightness(value) {
            console.log('调节亮度:', value);
        }

        function startVoiceRecording() {
            alert('语音识别功能演示');
        }

        // 发送控制指令到树莓派
        async function sendToRaspberryPi(device, command) {
            try {
                // 模拟发送到树莓派的逻辑
                console.log(`发送指令: 设备=${device}, 命令=${command}`);
                
                // 这里可以集成真实的树莓派API调用
                // const response = await fetch(`http://树莓派IP/api/control`, {
                //     method: 'POST',
                //     body: JSON.stringify({ device, command })
                // });
                
                return { success: true };
            } catch (error) {
                console.error('发送失败:', error);
                return { success: false, error: error.message };
            }
        }

        // 重置到初始状态
        function resetToInitialState() {
            elements.resultState.classList.add('hidden');
            elements.thinkingState.classList.add('hidden');
            elements.initialState.classList.remove('hidden');
        }

        // 工具函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化硬件状态
            elements.hardwareStatus.classList.add('led-green');
        });

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideInputDialog();
            }
        });
    </script>
</body>
