<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision API 测试页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .fan-on {
            animation: spin 0.5s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 头部 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2">🎯 Vision API 测试页面</h1>
            <p class="text-gray-400">测试手势识别和MQTT控制功能</p>
        </div>

        <!-- 状态指示器 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div id="serverStatus" class="bg-gray-800 rounded-lg p-4 text-center">
                <div class="text-2xl mb-2">🌐</div>
                <div class="font-semibold">服务器状态</div>
                <div id="serverStatusText" class="text-sm text-gray-400">检测中...</div>
            </div>
            <div id="mqttStatus" class="bg-gray-800 rounded-lg p-4 text-center">
                <div class="text-2xl mb-2">📡</div>
                <div class="font-semibold">MQTT状态</div>
                <div id="mqttStatusText" class="text-sm text-gray-400">连接中...</div>
            </div>
            <div id="fanStatus" class="bg-gray-800 rounded-lg p-4 text-center">
                <div id="fanIcon" class="text-2xl mb-2">❄️</div>
                <div class="font-semibold">风扇状态</div>
                <div id="fanStatusText" class="text-sm text-gray-400">OFF</div>
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 左侧：测试控制 -->
            <div class="space-y-6">
                <!-- API测试 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">🧪 API 测试</h2>
                    <div class="space-y-4">
                        <button id="testVisionAPI" class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">
                            🎯 测试视觉识别API
                        </button>
                        <button id="getMockImage" class="w-full px-4 py-3 bg-green-600 hover:bg-green-700 rounded-lg transition-colors">
                            📷 模拟摄像头图片
                        </button>
                        <button id="refreshStatus" class="w-full px-4 py-3 bg-gray-600 hover:bg-gray-700 rounded-lg transition-colors">
                            🔄 刷新状态
                        </button>
                    </div>
                </div>

                <!-- 图片上传 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">📤 图片上传测试</h2>
                    <div class="space-y-4">
                        <div class="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center">
                            <input type="file" id="imageUpload" accept="image/*" class="hidden">
                            <label for="imageUpload" class="cursor-pointer">
                                <div class="text-4xl mb-2">📸</div>
                                <div class="text-gray-400">点击上传图片测试手势识别</div>
                            </label>
                            <div id="uploadPreview" class="mt-4 hidden">
                                <img id="previewImage" class="max-w-full h-auto rounded" alt="Preview">
                            </div>
                        </div>
                        <button id="uploadTest" class="w-full px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors" disabled>
                            ⬆️ 上传并识别
                        </button>
                    </div>
                </div>

                <!-- 手势模拟 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">👋 手势模拟</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="gesture-btn px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-center" data-gesture="thumbs_up">
                            <div class="text-2xl mb-1">👍</div>
                            <div class="text-sm">点赞</div>
                        </button>
                        <button class="gesture-btn px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-center" data-gesture="thumbs_down">
                            <div class="text-2xl mb-1">👇</div>
                            <div class="text-sm">拇指向下</div>
                        </button>
                        <button class="gesture-btn px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-center" data-gesture="unknown">
                            <div class="text-2xl mb-1">❓</div>
                            <div class="text-sm">未知</div>
                        </button>
                        <button id="randomGesture" class="px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-center">
                            <div class="text-2xl mb-1">🎲</div>
                            <div class="text-sm">随机</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧：状态显示 -->
            <div class="space-y-6">
                <!-- 实时状态 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">📊 实时状态</h2>
                    <div id="visionState" class="space-y-3">
                        <div class="flex justify-between">
                            <span>最后手势:</span>
                            <span id="lastGesture" class="font-bold">--</span>
                        </div>
                        <div class="flex justify-between">
                            <span>最后指令:</span>
                            <span id="lastCommand" class="font-bold">--</span>
                        </div>
                        <div class="flex justify-between">
                            <span>置信度:</span>
                            <span id="lastConfidence" class="font-bold">--</span>
                        </div>
                        <div class="flex justify-between">
                            <span>总处理次数:</span>
                            <span id="totalProcessed" class="font-bold text-blue-400">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>ON指令次数:</span>
                            <span id="onCount" class="font-bold text-green-400">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>OFF指令次数:</span>
                            <span id="offCount" class="font-bold text-red-400">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>最后更新:</span>
                            <span id="lastUpdate" class="text-sm text-gray-400">--</span>
                        </div>
                    </div>
                </div>

                <!-- 日志输出 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold">📝 操作日志</h2>
                        <button id="clearLogs" class="text-sm text-gray-400 hover:text-white">清空</button>
                    </div>
                    <div id="logContainer" class="space-y-2 max-h-64 overflow-y-auto text-sm font-mono">
                        <div class="text-gray-500">等待操作...</div>
                    </div>
                </div>

                <!-- MQTT消息 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">📡 MQTT 消息</h2>
                    <div id="mqttMessages" class="space-y-2 text-sm">
                        <div class="text-gray-500">等待MQTT消息...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let visionState = null;
        let isPolling = false;
        let pollingInterval = null;

        // DOM元素
        const elements = {
            serverStatusText: document.getElementById('serverStatusText'),
            mqttStatusText: document.getElementById('mqttStatusText'),
            fanStatusText: document.getElementById('fanStatusText'),
            fanIcon: document.getElementById('fanIcon'),
            lastGesture: document.getElementById('lastGesture'),
            lastCommand: document.getElementById('lastCommand'),
            lastConfidence: document.getElementById('lastConfidence'),
            totalProcessed: document.getElementById('totalProcessed'),
            onCount: document.getElementById('onCount'),
            offCount: document.getElementById('offCount'),
            lastUpdate: document.getElementById('lastUpdate'),
            logContainer: document.getElementById('logContainer'),
            mqttMessages: document.getElementById('mqttMessages'),
            testVisionAPI: document.getElementById('testVisionAPI'),
            getMockImage: document.getElementById('getMockImage'),
            refreshStatus: document.getElementById('refreshStatus'),
            imageUpload: document.getElementById('imageUpload'),
            uploadPreview: document.getElementById('uploadPreview'),
            previewImage: document.getElementById('previewImage'),
            uploadTest: document.getElementById('uploadTest'),
            clearLogs: document.getElementById('clearLogs')
        };

        // 日志函数
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            
            const colors = {
                'success': 'text-green-400',
                'error': 'text-red-400',
                'warning': 'text-yellow-400',
                'info': 'text-blue-400'
            };
            
            logDiv.className = colors[type] || 'text-gray-400';
            logDiv.textContent = `[${timestamp}] ${message}`;
            
            elements.logContainer.insertBefore(logDiv, elements.logContainer.firstChild);
            
            // 限制日志数量
            while (elements.logContainer.children.length > 20) {
                elements.logContainer.removeChild(elements.logContainer.lastChild);
            }
        }

        // 更新服务器状态
        async function updateServerStatus() {
            try {
                const response = await fetch('http://localhost:3000/api/vision');
                if (response.ok) {
                    elements.serverStatusText.textContent = '在线';
                    elements.serverStatusText.className = 'text-sm text-green-400';
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                elements.serverStatusText.textContent = '离线';
                elements.serverStatusText.className = 'text-sm text-red-400';
                addLog(`服务器连接失败: ${error.message}`, 'error');
                return false;
            }
        }

        // 获取视觉状态
        async function fetchVisionState() {
            try {
                const response = await fetch('http://localhost:3000/api/vision');
                const data = await response.json();
                
                visionState = data;
                updateVisionDisplay();
                
                if (data.current_state) {
                    elements.serverStatusText.textContent = '在线';
                    elements.serverStatusText.className = 'text-sm text-green-400';
                }
                
            } catch (error) {
                addLog(`获取状态失败: ${error.message}`, 'error');
            }
        }

        // 更新视觉显示
        function updateVisionDisplay() {
            if (!visionState || !visionState.current_state) return;
            
            const state = visionState.current_state;
            
            // 更新手势显示
            const gestureMap = {
                'thumbs_up': '👍 点赞',
                'thumbs_down': '👇 拇指向下',
                'unknown': '❓ 未知'
            };
            
            elements.lastGesture.textContent = gestureMap[state.lastGesture] || state.lastGesture || '--';
            elements.lastCommand.textContent = state.lastCommand || '--';
            elements.lastConfidence.textContent = state.lastConfidence 
                ? `${(state.lastConfidence * 100).toFixed(1)}%` 
                : '--';
            elements.totalProcessed.textContent = state.totalProcessed || 0;
            elements.onCount.textContent = state.onCount || 0;
            elements.offCount.textContent = state.offCount || 0;
            elements.lastUpdate.textContent = state.lastProcessedAt 
                ? new Date(state.lastProcessedAt).toLocaleString()
                : '--';
            
            // 更新风扇状态
            updateFanStatus(state.lastCommand);
        }

        // 更新风扇状态
        function updateFanStatus(command) {
            if (command === 'ON') {
                elements.fanIcon.textContent = '🔥';
                elements.fanIcon.className = 'text-2xl mb-2 fan-on';
                elements.fanStatusText.textContent = 'ON (Spinning)';
                elements.fanStatusText.className = 'text-sm text-green-400';
            } else if (command === 'OFF') {
                elements.fanIcon.textContent = '❄️';
                elements.fanIcon.className = 'text-2xl mb-2';
                elements.fanStatusText.textContent = 'OFF';
                elements.fanStatusText.className = 'text-sm text-gray-400';
            } else {
                elements.fanIcon.textContent = '⭕';
                elements.fanIcon.className = 'text-2xl mb-2';
                elements.fanStatusText.textContent = 'UNKNOWN';
                elements.fanStatusText.className = 'text-sm text-yellow-400';
            }
        }

        // 测试视觉API
        async function testVisionAPI() {
            try {
                addLog('测试视觉识别API...', 'info');
                elements.testVisionAPI.disabled = true;
                elements.testVisionAPI.textContent = '🔄 测试中...';
                
                const response = await fetch('http://localhost:3000/api/test-vision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ testMode: true })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    addLog('视觉API测试成功', 'success');
                    await fetchVisionState(); // 刷新状态
                } else {
                    addLog(`视觉API测试失败: ${result.error}`, 'error');
                }
                
            } catch (error) {
                addLog(`API测试错误: ${error.message}`, 'error');
            } finally {
                elements.testVisionAPI.disabled = false;
                elements.testVisionAPI.textContent = '🎯 测试视觉识别API';
            }
        }

        // 获取模拟图片
        async function getMockImage() {
            try {
                addLog('生成模拟图片...', 'info');
                
                // 创建一个简单的canvas图片
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 240;
                const ctx = canvas.getContext('2d');
                
                // 绘制背景
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, 320, 240);
                
                // 绘制手势文字
                ctx.fillStyle = '#ffffff';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                const gestures = ['👍', '👇', '✌️'];
                const gesture = gestures[Math.floor(Math.random() * gestures.length)];
                ctx.fillText(gesture, 160, 120);
                
                // 转换为blob
                canvas.toBlob(async (blob) => {
                    if (blob) {
                        await uploadImage(blob);
                    }
                }, 'image/jpeg');
                
            } catch (error) {
                addLog(`生成模拟图片失败: ${error.message}`, 'error');
            }
        }

        // 上传图片
        async function uploadImage(imageBlob) {
            try {
                addLog('上传图片进行识别...', 'info');
                
                const formData = new FormData();
                formData.append('image', imageBlob, 'test.jpg');
                formData.append('deviceId', 'web-test-device');
                
                const response = await fetch('http://localhost:3000/api/vision', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    addLog('图片上传成功', 'success');
                    addLog(`识别手势: ${result.vision.gesture}, 置信度: ${(result.vision.confidence * 100).toFixed(1)}%`, 'info');
                    addLog(`下发指令: ${result.command.action} (${result.command.description})`, 'info');
                    
                    // 显示MQTT结果
                    if (result.mqtt && result.mqtt.success) {
                        addLog(`MQTT发布成功: ${result.mqtt.topic}`, 'success');
                        addMQTTMessage(result.mqtt.payload);
                    }
                    
                    await fetchVisionState(); // 刷新状态
                } else {
                    addLog(`图片上传失败: ${result.error}`, 'error');
                }
                
            } catch (error) {
                addLog(`上传图片失败: ${error.message}`, 'error');
            }
        }

        // 添加MQTT消息
        function addMQTTMessage(payload) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'text-green-400';
            messageDiv.innerHTML = `
                <div class="font-semibold">收到MQTT消息:</div>
                <div class="text-xs text-gray-400">
                    Command: ${payload.command} | 
                    Gesture: ${payload.gesture} | 
                    Time: ${new Date(payload.timestamp).toLocaleTimeString()}
                </div>
            `;
            
            elements.mqttMessages.insertBefore(messageDiv, elements.mqttMessages.firstChild);
            
            // 限制消息数量
            while (elements.mqttMessages.children.length > 10) {
                elements.mqttMessages.removeChild(elements.mqttMessages.lastChild);
            }
        }

        // 开始轮询
        function startPolling() {
            if (isPolling) return;
            
            isPolling = true;
            pollingInterval = setInterval(fetchVisionState, 2000);
            addLog('开始轮询状态', 'info');
        }

        // 停止轮询
        function stopPolling() {
            if (!isPolling) return;
            
            isPolling = false;
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            addLog('停止轮询状态', 'info');
        }

        // 事件监听器
        elements.testVisionAPI.addEventListener('click', testVisionAPI);
        elements.getMockImage.addEventListener('click', getMockImage);
        elements.refreshStatus.addEventListener('click', fetchVisionState);
        elements.clearLogs.addEventListener('click', () => {
            elements.logContainer.innerHTML = '<div class="text-gray-500">等待操作...</div>';
            elements.mqttMessages.innerHTML = '<div class="text-gray-500">等待MQTT消息...</div>';
        });

        // 图片上传
        elements.imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    elements.previewImage.src = e.target.result;
                    elements.uploadPreview.classList.remove('hidden');
                    elements.uploadTest.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        elements.uploadTest.addEventListener('click', () => {
            if (elements.previewImage.src) {
                // 将dataURL转换为blob
                fetch(elements.previewImage.src)
                    .then(res => res.blob())
                    .then(blob => uploadImage(blob));
            }
        });

        // 手势按钮
        document.querySelectorAll('.gesture-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const gesture = btn.dataset.gesture;
                addLog(`模拟手势: ${gesture}`, 'info');
                // 这里可以发送模拟的手势数据到API
            });
        });

        // 随机手势
        document.getElementById('randomGesture').addEventListener('click', () => {
            getMockImage();
        });

        // 初始化
        async function init() {
            addLog('初始化测试页面...', 'info');
            
            // 更新MQTT状态
            elements.mqttStatusText.textContent = '已连接';
            elements.mqttStatusText.className = 'text-sm text-green-400';
            
            // 检查服务器状态
            await updateServerStatus();
            
            // 获取初始状态
            await fetchVisionState();
            
            // 开始轮询
            startPolling();
            
            addLog('测试页面初始化完成', 'success');
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);

        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            stopPolling();
        });
    </script>
</body>
</html>
