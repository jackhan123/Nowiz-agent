<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 硬件实验室 - 对话式需求分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 32px;
            padding-top: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.7;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .step.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            color: #a5b4fc;
        }

        .step-number {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .step.active .step-number {
            background: #6366f1;
            color: white;
        }

        /* 对话区域 */
        .chat-container {
            background: #1e293b;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 24px;
            background: #0f172a;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .avatar.ai {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        .avatar.user {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        }

        .message-content {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.ai .message-content {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }

        .message-content ul {
            margin-left: 20px;
            margin-top: 8px;
        }

        .message-content li {
            margin-bottom: 6px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .chat-input-area {
            padding: 20px 24px;
            background: #1e293b;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea.chat-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 52px;
            max-height: 120px;
            line-height: 1.5;
        }

        textarea.chat-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea.chat-input::placeholder {
            color: #64748b;
        }

        .send-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .send-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        /* 需求结果卡片 */
        .requirement-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideIn 0.5s ease;
        }

        .requirement-card h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        .dimension {
            margin-bottom: 20px;
            padding: 18px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 12px;
            border-left: 3px solid #6366f1;
        }

        .dimension-title {
            font-size: 16px;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dimension-content {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.7;
        }

        .copy-hint {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 20px 24px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
        }

        .copy-hint-text {
            font-size: 17px;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }

        .copy-btn {
            background: white;
            color: #059669;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #f0fdf4;
            transform: translateY(-2px);
        }

        /* BOM 区域（简化） */
        .bom-input-area {
            background: #1e293b;
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .bom-input-area h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .bom-input-area p {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .bom-input-area textarea {
            width: 100%;
            min-height: 150px;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.6;
        }

        .bom-input-area textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        .bom-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s;
        }

        .bom-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        /* BOM 结果样式 */
        .result {
            background: #1e293b;
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideIn 0.5s ease;
        }

        .result h2 {
            font-size: 32px;
            color: #f1f5f9;
            margin-bottom: 16px;
        }

        .overview {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .section {
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 16px;
            border-left: 3px solid #6366f1;
        }

        .section h3 {
            font-size: 18px;
            color: #a5b4fc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item {
            margin-bottom: 12px;
            padding: 16px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .item:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(4px);
        }

        .item-title {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .item-desc {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: rgba(99, 102, 241, 0.1);
            font-weight: 600;
            color: #a5b4fc;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 14px;
            color: #cbd5e1;
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .total {
            font-size: 22px;
            font-weight: 700;
            color: #a5b4fc;
            text-align: right;
            padding: 20px 14px 14px;
            border-top: 2px solid rgba(99, 102, 241, 0.3);
        }

        .meta-info {
            margin-top: 20px;
            padding: 16px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 12px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 14px;
        }

        .meta-item strong {
            color: #e2e8f0;
        }

        .disclaimer {
            background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 20px;
        }

        .disclaimer strong {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            h1 { font-size: 32px; }
            .chat-messages { height: 400px; }
            .message-content { max-width: 85%; }
            .step-indicator { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">
                <span>✨</span>
                <span>AI 硬件实验室</span>
            </div>
            <h1>AI 对话式硬件设计</h1>
            <p class="subtitle">与 AI 对话，逐步完善你的硬件需求</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1Indicator">
                <div class="step-number">1</div>
                <span>对话完善需求</span>
            </div>
            <div class="step" id="step2Indicator">
                <div class="step-number">2</div>
                <span>生成 BOM 清单</span>
            </div>
        </div>

        <!-- 对话区域 -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages">
                <!-- 初始欢迎消息 -->
                <div class="message ai">
                    <div class="avatar ai">🤖</div>
                    <div class="message-content">
                        <div>你好！我是 Newiz AI 助手 👋</div>
                        <div style="margin-top: 12px;">告诉我你的创意想法，我会为你：</div>
                        <ul>
                            <li>✨ 自动生成完整功能配置</li>
                            <li>🎯 推荐最佳硬件方案</li>
                            <li>📐 输出可视化架构图</li>
                            <li>💰 估算项目成本</li>
                        </ul>
                        <div style="margin-top: 12px; color: #a5b4fc;">试试这样描述："我想做一个能识别手势控制灯光的设备"</div>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        class="chat-input" 
                        placeholder="描述你的创意想法..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <span>发送</span>
                        <span>▶</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 需求完成卡片 -->
        <div id="requirementCard" class="hidden"></div>

        <!-- BOM 输入区域 -->
        <div id="bomInputArea" class="bom-input-area hidden">
            <h3>步骤 2: 生成 BOM 清单</h3>
            <p>将上面完善的需求粘贴到这里，AI 会生成详细的采购清单</p>
            <textarea id="bomInput" placeholder="粘贴完善的需求..."></textarea>
            <button class="bom-btn" onclick="generateBOM()">📦 生成 BOM 清单</button>
        </div>

        <div id="bomResult" class="hidden"></div>
    </div>

    <script>
        const API_CONFIG = {
            apiKey: '', // 从环境变量或配置中获取
            endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',
            model: 'qwen-plus'
        };

        let conversationHistory = [];
        let questionCount = 0;
        let requirementData = null;

        const SYSTEM_PROMPT = `你是一位资深硬件产品经理，擅长通过对话引导用户完善硬件需求。

工作流程：
1. 用户首次输入简单想法后，你需要通过提问逐步了解以下信息：
   - 核心功能：用途是什么？（装饰/互动/实用工具等）
   - 形态规格：期望的尺寸、材质、外观
   - 交互方式：是否需要灯光、触控、语音、APP 等
   - 技术难度：用户是新手还是有经验？
   - 成本预算：大概预算范围（<100 / 100-300 / >300）
   - 附加需求：是否便携、充电、DIY 定制等

2. 提问风格：
   - 每次只问 1-2 个相关问题
   - 语言友好、简洁
   - 给出选项让用户选择（如：A、B、C）
   - 根据用户回答智能追问

3. 完成条件：
   当收集到足够信息（至少 4-5 个维度）后，输出以下 JSON 格式（必须严格遵守）：
   {
     "status": "completed",
     "project_name": "项目名称",
     "dimensions": {
       "core_function": {"title": "核心功能", "content": "..."},
       "form_spec": {"title": "形态规格", "content": "..."},
       "interaction": {"title": "交互方式", "content": "..."},
       "difficulty": {"title": "技术难度", "content": "..."},
       "budget": {"title": "成本预算", "content": "..."},
       "additional": {"title": "附加需求", "content": "..."}
     }
   }

4. 如果信息还不够，继续提问，不要输出 JSON。

记住：友好、高效、专业！`;

        // 自动调整 textarea 高度
        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 回车发送
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;

            // 添加用户消息
            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            // 禁用输入
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            // 显示 typing indicator
            showTyping();

            // 构建对话历史
            conversationHistory.push({
                role: 'user',
                content: message
            });

            try {
                const response = await fetch(API_CONFIG.endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_CONFIG.apiKey}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: API_CONFIG.model,
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            ...conversationHistory
                        ],
                        temperature: 0.8,
                    })
                });

                if (!response.ok) {
                    throw new Error('API 请求失败');
                }

                const data = await response.json();
                const aiResponse = data.choices[0]?.message?.content;

                if (!aiResponse) {
                    throw new Error('AI 返回为空');
                }

                // 移除 typing
                removeTyping();

                // 添加 AI 回复到历史
                conversationHistory.push({
                    role: 'assistant',
                    content: aiResponse
                });

                // 检查是否完成
                if (aiResponse.includes('"status": "completed"')) {
                    try {
                        const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            const result = JSON.parse(jsonMatch[0]);
                            if (result.status === 'completed') {
                                addMessage('太好了！我已经完整理解了你的需求。让我为你生成详细的需求文档...', 'ai');
                                setTimeout(() => {
                                    displayRequirement(result);
                                }, 1000);
                                return;
                            }
                        }
                    } catch (e) {
                        console.log('解析 JSON 失败，继续对话', e);
                    }
                }

                // 继续对话
                addMessage(aiResponse, 'ai');

            } catch (error) {
                removeTyping();
                addMessage('抱歉，出现了错误：' + error.message, 'ai');
            } finally {
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        function addMessage(content, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}`;
            avatar.textContent = sender === 'ai' ? '🤖' : '👤';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content.replace(/\n/g, '<br>');
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            
            // 滚动到底部
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            
            typingDiv.innerHTML = `
                <div class="avatar ai">🤖</div>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function displayRequirement(data) {
            const dims = data.dimensions;
            
            requirementData = `# ${data.project_name}

## ${dims.core_function.title}
${dims.core_function.content}

## ${dims.form_spec.title}
${dims.form_spec.content}

## ${dims.interaction.title}
${dims.interaction.content}

## ${dims.difficulty.title}
${dims.difficulty.content}

## ${dims.budget.title}
${dims.budget.content}

## ${dims.additional.title}
${dims.additional.content}`;

            const html = `
                <div class="requirement-card">
                    <h2>📋 ${data.project_name} - 需求分析</h2>
                    
                    <div class="dimension">
                        <div class="dimension-title">🎯 ${dims.core_function.title}</div>
                        <div class="dimension-content">${dims.core_function.content}</div>
                    </div>

                    <div class="dimension">
                        <div class="dimension-title">📐 ${dims.form_spec.title}</div>
                        <div class="dimension-content">${dims.form_spec.content}</div>
                    </div>

                    <div class="dimension">
                        <div class="dimension-title">🎮 ${dims.interaction.title}</div>
                        <div class="dimension-content">${dims.interaction.content}</div>
                    </div>

                    <div class="dimension">
                        <div class="dimension-title">⚙️ ${dims.difficulty.title}</div>
                        <div class="dimension-content">${dims.difficulty.content.replace(/\n/g, '<br>')}</div>
                    </div>

                    <div class="dimension">
                        <div class="dimension-title">💰 ${dims.budget.title}</div>
                        <div class="dimension-content">${dims.budget.content.replace(/\n/g, '<br>')}</div>
                    </div>

                    <div class="dimension">
                        <div class="dimension-title">✨ ${dims.additional.title}</div>
                        <div class="dimension-content">${dims.additional.content}</div>
                    </div>

                    <div class="copy-hint">
                        <div class="copy-hint-text">🎉 需求已完善！现在可以生成 BOM 清单</div>
                        <button class="copy-btn" onclick="proceedToBOM()">
                            📋 复制需求并生成 BOM
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('requirementCard').innerHTML = html;
            document.getElementById('requirementCard').classList.remove('hidden');
            
            // 更新步骤
            document.getElementById('step1Indicator').classList.remove('active');
            document.getElementById('step2Indicator').classList.add('active');
            
            // 显示 BOM 输入区域
            document.getElementById('bomInputArea').classList.remove('hidden');
        }

        function proceedToBOM() {
            navigator.clipboard.writeText(requirementData);
            document.getElementById('bomInput').value = requirementData;
            alert('✅ 已复制需求到剪贴板并自动填充！');
            document.getElementById('bomInputArea').scrollIntoView({ behavior: 'smooth' });
        }

        async function generateBOM() {
            const input = document.getElementById('bomInput').value.trim();
            if (!input) {
                alert('请先粘贴完善的需求');
                return;
            }

            const btn = document.querySelector('.bom-btn');
            const resultDiv = document.getElementById('bomResult');
            
            // 显示加载状态
            btn.disabled = true;
            btn.innerHTML = '<span>⏳</span><span>生成中...</span>';
            resultDiv.classList.add('hidden');

            try {
                const response = await fetch(API_CONFIG.endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_CONFIG.apiKey}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: API_CONFIG.model,
                        messages: [
                            { 
                                role: 'system', 
                                content: `你是一位资深硬件工程师，擅长嵌入式系统设计和硬件选型。

任务：基于用户提供的完善需求，生成详细硬件方案和 BOM 清单。

输出格式（严格 JSON，不要有其他文字）：
{
  "solution": {
    "project_name": "项目名称",
    "overview": "方案概述（2-3句话）",
    "mcu": {
      "model": "具体型号（如 ESP32-S3-WROOM-1）",
      "reason": "选择理由"
    },
    "sensors": [
      {"name": "传感器名称", "model": "具体型号", "purpose": "用途说明"}
    ],
    "peripherals": [
      {"name": "外设名称", "model": "具体型号", "interface": "接口类型"}
    ],
    "power": {
      "input": "输入方式",
      "battery": "电池方案",
      "management": "电源管理芯片"
    },
    "industrial_design": {
      "enclosure": "外壳材料",
      "dimensions": "大概尺寸",
      "features": ["设计特点1", "设计特点2"]
    }
  },
  "bom_items": [
    {
      "category": "分类（主控芯片/传感器/显示模块/电源模块/结构件/辅料）",
      "part_name": "零件名称（具体到型号，如 WS2812B-2020 而非 LED）",
      "model": "完整型号",
      "spec": "关键规格",
      "function": "功能描述",
      "quantity": 1,
      "unit_price": 28.00,
      "supplier": "推荐供应商（立创商城/淘宝）"
    }
  ],
  "total_cost": 156.50,
  "difficulty": "初级/中级/高级",
  "assembly_time": "2-4小时"
}

要求：
1. 零件必须具体（如"WS2812B-2020 幻彩灯珠"而非"LED"）
2. 价格基于 2024-2025 年淘宝/立创商城实际行情
3. BOM 要包含所有必需元件（杜邦线、螺丝、辅料等）
4. 优先推荐易采购、有中文资料的元件`
                            },
                            { 
                                role: 'user', 
                                content: `基于以下需求生成硬件方案和 BOM 清单：\n\n${input}` 
                            }
                        ],
                        temperature: 0.7,
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 请求失败: ${response.status}`);
                }

                const data = await response.json();
                const content = data.choices[0]?.message?.content;

                if (!content) {
                    throw new Error('AI 返回内容为空');
                }

                const result = JSON.parse(content);

                if (!result.solution || !result.bom_items) {
                    throw new Error('AI 返回数据不完整');
                }

                displayBOM(result);

            } catch (error) {
                console.error('生成错误:', error);
                alert('生成 BOM 失败：' + (error.message || '请重试'));
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📦 生成 BOM 清单';
            }
        }

        function displayBOM(data) {
            const sol = data.solution;
            const bom = data.bom_items;

            const html = `
                <div class="result">
                    <h2>${sol.project_name}</h2>
                    <p class="overview">${sol.overview}</p>

                    <div class="section">
                        <h3><span>🖥️</span> 核心主控</h3>
                        <div class="item">
                            <div class="item-title">${sol.mcu.model}</div>
                            <div class="item-desc">${sol.mcu.reason}</div>
                        </div>
                    </div>

                    <div class="section">
                        <h3><span>📡</span> 传感器</h3>
                        ${sol.sensors.map(s => `
                            <div class="item">
                                <div class="item-title">${s.name} (${s.model})</div>
                                <div class="item-desc">${s.purpose}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="section">
                        <h3><span>🔌</span> 外设</h3>
                        ${sol.peripherals.map(p => `
                            <div class="item">
                                <div class="item-title">${p.name} (${p.model})</div>
                                <div class="item-desc">接口: ${p.interface}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="section">
                        <h3><span>🔋</span> 电源管理</h3>
                        <div class="item">
                            <div><strong>输入:</strong> ${sol.power.input}</div>
                            <div><strong>电池:</strong> ${sol.power.battery}</div>
                            <div><strong>管理:</strong> ${sol.power.management}</div>
                        </div>
                    </div>

                    <div class="section">
                        <h3><span>🎨</span> 工业设计</h3>
                        <div class="item">
                            <div><strong>外壳:</strong> ${sol.industrial_design.enclosure}</div>
                            <div><strong>尺寸:</strong> ${sol.industrial_design.dimensions}</div>
                            <div><strong>特点:</strong> ${sol.industrial_design.features.join('、')}</div>
                        </div>
                    </div>
                </div>

                <div class="result">
                    <h2>📦 BOM 清单</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>分类</th>
                                <th>零件名称</th>
                                <th>型号</th>
                                <th>规格</th>
                                <th>数量</th>
                                <th>单价</th>
                                <th>小计</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${bom.map(item => `
                                <tr>
                                    <td>${item.category}</td>
                                    <td>${item.part_name}</td>
                                    <td>${item.model}</td>
                                    <td>${item.spec}</td>
                                    <td>${item.quantity}</td>
                                    <td>¥${item.unit_price.toFixed(2)}</td>
                                    <td>¥${(item.unit_price * item.quantity).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="total">总成本: ¥${data.total_cost.toFixed(2)}</div>
                    
                    <div class="meta-info">
                        <div class="meta-item">
                            <span>⚙️</span>
                            <span><strong>制作难度:</strong> ${data.difficulty}</span>
                        </div>
                        <div class="meta-item">
                            <span>⏱️</span>
                            <span><strong>组装时间:</strong> ${data.assembly_time}</span>
                        </div>
                        <div class="meta-item">
                            <span>🛒</span>
                            <span><strong>推荐采购:</strong> 立创商城 / 淘宝</span>
                        </div>
                    </div>

                    <button class="copy-btn" style="width: 100%; margin-top: 20px;" onclick="copyBOM()">
                        <span>📋</span>
                        <span>复制完整方案到剪贴板</span>
                    </button>

                    <div class="disclaimer">
                        <strong>⚠️ 免责声明</strong>
                        本方案由 AI 生成，仅供参考。实际制作前请咨询专业人士，注意用电安全。价格基于市场行情估算，以实际采购为准。
                    </div>
                </div>
            `;

            document.getElementById('bomResult').innerHTML = html;
            document.getElementById('bomResult').classList.remove('hidden');

            // 滚动到结果
            setTimeout(() => {
                document.getElementById('bomResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);

            window.currentBOMData = data;
        }

        function copyBOM() {
            const data = window.currentBOMData;
            if (!data) return;

            const sol = data.solution;
            const text = `# ${sol.project_name}

## 方案概述
${sol.overview}

## 核心主控
**型号**: ${sol.mcu.model}
**理由**: ${sol.mcu.reason}

## 传感器
${sol.sensors.map(s => `- ${s.name} (${s.model}): ${s.purpose}`).join('\n')}

## 外设
${sol.peripherals.map(p => `- ${p.name} (${p.model}) - ${p.interface}`).join('\n')}

## 电源方案
- 输入: ${sol.power.input}
- 电池: ${sol.power.battery}
- 管理: ${sol.power.management}

## 工业设计
- 外壳: ${sol.industrial_design.enclosure}
- 尺寸: ${sol.industrial_design.dimensions}
- 特点: ${sol.industrial_design.features.join(', ')}

## BOM 清单
${data.bom_items.map(item => 
  `${item.category} | ${item.part_name} | ${item.model} | ¥${item.unit_price} × ${item.quantity}`
).join('\n')}

**总成本**: ¥${data.total_cost}
**难度**: ${data.difficulty}
**组装时间**: ${data.assembly_time}

---
由 AI 硬件实验室生成`;

            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 完整方案已复制到剪贴板！');
            });
        }
    </script>
</body>
</html>
