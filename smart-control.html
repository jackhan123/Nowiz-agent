<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能控制中心 - Newiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fanRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .fan-running {
            animation: fanRotate 0.5s linear infinite;
        }
        
        .fan-stopped {
            animation: none;
        }
        
        .pulse-green {
            animation: pulse-green 2s ease-in-out infinite;
        }
        
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        }
        
        .status-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .led-on {
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }
        
        .led-off {
            background-color: #374151;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- 头部 -->
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold mb-2">智能控制中心</h1>
            <p class="text-gray-400">手势智能控制 • 硬件感知响应</p>
        </div>

        <!-- 模式切换 -->
        <div class="mb-6 bg-gray-800 rounded-lg p-4">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-semibold mb-1">运行模式</h3>
                    <p class="text-sm text-gray-400">
                        <span id="modeDescription">当前：模拟模式（用于演示和测试）</span>
                    </p>
                </div>
                <div class="flex items-center space-x-2">
                    <label class="text-sm">模拟模式</label>
                    <button id="modeToggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1"></span>
                    </button>
                    <label class="text-sm">真实模式</label>
                </div>
            </div>
            <div id="hardwareConfig" class="mt-3 hidden">
                <input type="text" id="raspberryPiIP" placeholder="树莓派IP地址 (如: 192.168.1.100)" 
                       class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500 focus:outline-none">
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 左侧：摄像头和识别 -->
            <div class="space-y-6">
                <!-- 摄像头预览 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4 flex items-center">
                        <span class="w-3 h-3 bg-red-500 rounded-full mr-2 animate-pulse"></span>
                        实时摄像头
                    </h2>
                    <div class="relative bg-black rounded-lg overflow-hidden aspect-video">
                        <video id="videoElement" class="w-full h-full object-cover" autoplay></video>
                        <canvas id="canvasElement" class="hidden"></canvas>
                        <div id="cameraPlaceholder" class="absolute inset-0 flex items-center justify-center bg-gray-900">
                            <div class="text-center">
                                <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                </svg>
                                <p class="text-gray-500 mb-4">点击下方按钮启动摄像头</p>
                                <button id="startCamera" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">
                                    启动摄像头
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 手势识别结果 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">手势识别结果</h2>
                    <div id="gestureResult" class="space-y-3">
                        <div class="flex items-center justify-between p-4 bg-gray-700 rounded-lg">
                            <span class="text-gray-400">状态</span>
                            <span id="recognitionStatus" class="px-3 py-1 bg-gray-600 rounded-full text-sm">未开始</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-gray-700 rounded-lg">
                            <span class="text-gray-400">识别手势</span>
                            <span id="detectedGesture" class="font-mono text-lg">--</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-gray-700 rounded-lg">
                            <span class="text-gray-400">置信度</span>
                            <span id="confidence" class="font-mono">--%</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-gray-700 rounded-lg">
                            <span class="text-gray-400">处理时间</span>
                            <span id="processTime" class="font-mono">--ms</span>
                        </div>
                    </div>
                    <button id="manualTest" class="w-full mt-4 px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-colors">
                        模拟手势识别（测试用）
                    </button>
                </div>
            </div>

            <!-- 右侧：硬件控制 -->
            <div class="space-y-6">
                <!-- 风扇控制面板 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">风扇控制面板</h2>
                    <div class="space-y-4">
                        <!-- 风扇状态显示 -->
                        <div class="text-center py-8">
                            <div id="fanIcon" class="fan-stopped inline-block mb-4">
                                <svg class="w-24 h-24 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8M12,10A2,2 0 0,0 10,12A2,2 0 0,0 12,14A2,2 0 0,0 14,12A2,2 0 0,0 12,10Z"/>
                                </svg>
                            </div>
                            <div class="flex items-center justify-center space-x-2 mb-2">
                                <div id="statusLED" class="status-led led-off"></div>
                                <span id="fanStatus" class="text-lg font-semibold">已停止</span>
                            </div>
                            <div class="text-gray-400">
                                <span id="fanSpeed">转速: 0 RPM</span> • 
                                <span id="fanTemp">温度: --°C</span>
                            </div>
                        </div>

                        <!-- 手动控制按钮 -->
                        <div class="grid grid-cols-2 gap-4">
                            <button id="fanOn" class="px-4 py-3 bg-green-600 hover:bg-green-700 rounded-lg transition-colors flex items-center justify-center">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                启动
                            </button>
                            <button id="fanOff" class="px-4 py-3 bg-red-600 hover:bg-red-700 rounded-lg transition-colors flex items-center justify-center">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                                </svg>
                                停止
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 控制日志 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-semibold">控制日志</h2>
                        <button id="clearLogs" class="text-sm text-gray-400 hover:text-white">清空</button>
                    </div>
                    <div id="controlLogs" class="space-y-2 max-h-64 overflow-y-auto">
                        <div class="text-sm text-gray-500">等待操作...</div>
                    </div>
                </div>

                <!-- 系统信息 -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">系统信息</h2>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="p-3 bg-gray-700 rounded">
                            <div class="text-gray-400">连接状态</div>
                            <div id="connectionStatus" class="font-semibold text-green-400">已连接</div>
                        </div>
                        <div class="p-3 bg-gray-700 rounded">
                            <div class="text-gray-400">API状态</div>
                            <div id="apiStatus" class="font-semibold text-yellow-400">待测试</div>
                        </div>
                        <div class="p-3 bg-gray-700 rounded">
                            <div class="text-gray-400">响应时间</div>
                            <div id="responseTime" class="font-semibold">--ms</div>
                        </div>
                        <div class="p-3 bg-gray-700 rounded">
                            <div class="text-gray-400">操作次数</div>
                            <div id="operationCount" class="font-semibold">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 硬件抽象层 (HAL)
        const HAL = {
            mode: 'simulation', // 'simulation' 或 'real'
            
            init(mode) {
                this.mode = mode;
            },
            
            // 控制风扇
            async controlFan(command) {
                if (this.mode === 'simulation') {
                    return this.simulateFanControl(command);
                } else {
                    return this.realFanControl(command);
                }
            },
            
            // 模拟风扇控制
            simulateFanControl(command) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({
                            success: true,
                            command: command,
                            mode: 'simulation',
                            timestamp: new Date().toISOString(),
                            message: `模拟执行: ${command === 'on' ? '启动' : '停止'}风扇`
                        });
                    }, 1000 + Math.random() * 1000); // 1-2秒随机延迟
                });
            },
            
            // 真实风扇控制
            async realFanControl(command) {
                try {
                    const ip = document.getElementById('raspberryPiIP').value || '192.168.1.100';
                    const response = await fetch(`http://${ip}/api/fan`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ command: command })
                    });
                    
                    const result = await response.json();
                    return {
                        success: true,
                        command: command,
                        mode: 'real',
                        timestamp: new Date().toISOString(),
                        data: result
                    };
                } catch (error) {
                    return {
                        success: false,
                        command: command,
                        mode: 'real',
                        timestamp: new Date().toISOString(),
                        error: error.message
                    };
                }
            },
            
            // 获取风扇状态
            async getFanStatus() {
                if (this.mode === 'simulation') {
                    return this.simulateFanStatus();
                } else {
                    return this.realFanStatus();
                }
            },
            
            simulateFanStatus() {
                return {
                    running: Math.random() > 0.5,
                    speed: Math.floor(Math.random() * 2000),
                    temperature: 20 + Math.random() * 15,
                    mode: 'simulation'
                };
            },
            
            async realFanStatus() {
                try {
                    const ip = document.getElementById('raspberryPiIP').value || '192.168.1.100';
                    const response = await fetch(`http://${ip}/api/status`);
                    return await response.json();
                } catch (error) {
                    return {
                        running: false,
                        speed: 0,
                        temperature: 0,
                        error: error.message
                    };
                }
            }
        };

        // 阿里云API配置
        const ALIYUN_CONFIG = {
            apiKey: '', // 从环境变量或配置中获取
            endpoint: 'https://visual.cn-shanghai.aliyuncs.com', // 示例端点
            gestureRecognition: true
        };

        // 全局状态
        let isStreamActive = false;
        let recognitionInterval = null;
        let operationCounter = 0;

        // DOM元素
        const elements = {
            videoElement: document.getElementById('videoElement'),
            canvasElement: document.getElementById('canvasElement'),
            cameraPlaceholder: document.getElementById('cameraPlaceholder'),
            startCamera: document.getElementById('startCamera'),
            recognitionStatus: document.getElementById('recognitionStatus'),
            detectedGesture: document.getElementById('detectedGesture'),
            confidence: document.getElementById('confidence'),
            processTime: document.getElementById('processTime'),
            manualTest: document.getElementById('manualTest'),
            fanIcon: document.getElementById('fanIcon'),
            fanStatus: document.getElementById('fanStatus'),
            fanSpeed: document.getElementById('fanSpeed'),
            fanTemp: document.getElementById('fanTemp'),
            statusLED: document.getElementById('statusLED'),
            fanOn: document.getElementById('fanOn'),
            fanOff: document.getElementById('fanOff'),
            controlLogs: document.getElementById('controlLogs'),
            clearLogs: document.getElementById('clearLogs'),
            modeToggle: document.getElementById('modeToggle'),
            modeDescription: document.getElementById('modeDescription'),
            hardwareConfig: document.getElementById('hardwareConfig'),
            raspberryPiIP: document.getElementById('raspberryPiIP'),
            connectionStatus: document.getElementById('connectionStatus'),
            apiStatus: document.getElementById('apiStatus'),
            responseTime: document.getElementById('responseTime'),
            operationCount: document.getElementById('operationCount')
        };

        // 摄像头管理
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                elements.videoElement.srcObject = stream;
                elements.cameraPlaceholder.classList.add('hidden');
                isStreamActive = true;
                addLog('摄像头已启动', 'success');
                startGestureRecognition();
            } catch (error) {
                addLog(`摄像头启动失败: ${error.message}`, 'error');
            }
        }

        // 手势识别
        function startGestureRecognition() {
            elements.recognitionStatus.textContent = '识别中';
            elements.recognitionStatus.className = 'px-3 py-1 bg-green-600 rounded-full text-sm animate-pulse';
            
            recognitionInterval = setInterval(async () => {
                if (!isStreamActive) return;
                
                const startTime = Date.now();
                try {
                    // 捕获当前帧
                    const canvas = elements.canvasElement;
                    const context = canvas.getContext('2d');
                    canvas.width = elements.videoElement.videoWidth;
                    canvas.height = elements.videoElement.videoHeight;
                    context.drawImage(elements.videoElement, 0, 0);
                    
                    // 模拟手势识别（实际应用中这里调用阿里云API）
                    const gestureResult = await simulateGestureRecognition(canvas.toDataURL());
                    
                    const processTime = Date.now() - startTime;
                    updateGestureDisplay(gestureResult, processTime);
                    
                    // 根据手势控制风扇
                    if (gestureResult.gesture && gestureResult.confidence > 0.7) {
                        handleGestureCommand(gestureResult.gesture);
                    }
                    
                } catch (error) {
                    console.error('手势识别错误:', error);
                }
            }, 2000); // 每2秒识别一次
        }

        // 模拟手势识别（实际应用中替换为阿里云API调用）
        async function simulateGestureRecognition(imageData) {
            // 模拟网络延迟
            await new Promise(resolve => setTimeout(resolve, 300 + Math.random() * 700));
            
            const gestures = ['thumbs_up', 'open_palm', 'peace_sign', 'point_up'];
            const randomGesture = gestures[Math.floor(Math.random() * gestures.length)];
            const confidence = 0.6 + Math.random() * 0.4;
            
            return {
                gesture: randomGesture,
                confidence: confidence,
                timestamp: new Date().toISOString()
            };
        }

        // 实际的手势识别API调用
        async function callAliyunGestureAPI(imageData) {
            try {
                const response = await fetch(ALIYUN_CONFIG.endpoint + '/api/recognize-gesture', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${ALIYUN_CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image: imageData,
                        gesture_types: ['thumbs_up', 'open_palm', 'peace_sign']
                    })
                });
                
                return await response.json();
            } catch (error) {
                throw new Error(`API调用失败: ${error.message}`);
            }
        }

        // 更新手势显示
        function updateGestureDisplay(result, processTime) {
            elements.detectedGesture.textContent = getGestureName(result.gesture);
            elements.confidence.textContent = `${(result.confidence * 100).toFixed(1)}%`;
            elements.processTime.textContent = `${processTime}ms`;
            
            // 根据置信度改变颜色
            if (result.confidence > 0.8) {
                elements.detectedGesture.className = 'font-mono text-lg text-green-400';
            } else if (result.confidence > 0.6) {
                elements.detectedGesture.className = 'font-mono text-lg text-yellow-400';
            } else {
                elements.detectedGesture.className = 'font-mono text-lg text-red-400';
            }
        }

        // 获取手势名称
        function getGestureName(gesture) {
            const names = {
                'thumbs_up': '👍 点赞',
                'open_palm': '✋ 张开手掌',
                'peace_sign': '✌️ 胜利手势',
                'point_up': '☝️ 指向上',
                'fist': '✊ 拳头',
                'ok': '👌 OK手势'
            };
            return names[gesture] || gesture;
        }

        // 处理手势命令
        function handleGestureCommand(gesture) {
            let command = null;
            
            switch(gesture) {
                case 'thumbs_up':
                case 'point_up':
                    command = 'on';
                    break;
                case 'open_palm':
                case 'fist':
                case 'ok':
                    command = 'off';
                    break;
                default:
                    return;
            }
            
            if (command) {
                executeFanControl(command, `手势识别: ${getGestureName(gesture)}`);
            }
        }

        // 执行风扇控制
        async function executeFanControl(command, source = '手动操作') {
            const startTime = Date.now();
            
            try {
                const result = await HAL.controlFan(command);
                const responseTime = Date.now() - startTime;
                
                if (result.success) {
                    updateFanDisplay(command === 'on');
                    addLog(`${source} - ${result.message}`, 'success');
                    operationCounter++;
                    elements.operationCount.textContent = operationCounter;
                    elements.responseTime.textContent = `${responseTime}ms`;
                } else {
                    addLog(`${source} - 控制失败: ${result.error}`, 'error');
                }
            } catch (error) {
                addLog(`${source} - 控制错误: ${error.message}`, 'error');
            }
        }

        // 更新风扇显示
        function updateFanDisplay(isRunning) {
            if (isRunning) {
                elements.fanIcon.classList.remove('fan-stopped');
                elements.fanIcon.classList.add('fan-running');
                elements.fanIcon.querySelector('svg').classList.remove('text-gray-400');
                elements.fanIcon.querySelector('svg').classList.add('text-blue-400');
                elements.fanStatus.textContent = '运行中';
                elements.fanSpeed.textContent = '转速: 1500 RPM';
                elements.fanTemp.textContent = '温度: 25°C';
                elements.statusLED.classList.remove('led-off');
                elements.statusLED.classList.add('led-on', 'pulse-green');
            } else {
                elements.fanIcon.classList.remove('fan-running');
                elements.fanIcon.classList.add('fan-stopped');
                elements.fanIcon.querySelector('svg').classList.remove('text-blue-400');
                elements.fanIcon.querySelector('svg').classList.add('text-gray-400');
                elements.fanStatus.textContent = '已停止';
                elements.fanSpeed.textContent = '转速: 0 RPM';
                elements.fanTemp.textContent = '温度: --°C';
                elements.statusLED.classList.remove('led-on', 'pulse-green');
                elements.statusLED.classList.add('led-off');
            }
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const logDiv = document.createElement('div');
            const timestamp = new Date().toLocaleTimeString();
            
            const colors = {
                'success': 'text-green-400',
                'error': 'text-red-400',
                'warning': 'text-yellow-400',
                'info': 'text-blue-400'
            };
            
            logDiv.className = `text-sm ${colors[type]} p-2 bg-gray-700 rounded`;
            logDiv.innerHTML = `<span class="text-gray-400">${timestamp}</span> ${message}`;
            
            elements.controlLogs.insertBefore(logDiv, elements.controlLogs.firstChild);
            
            // 限制日志数量
            if (elements.controlLogs.children.length > 20) {
                elements.controlLogs.removeChild(elements.controlLogs.lastChild);
            }
        }

        // 清空日志
        function clearLogs() {
            elements.controlLogs.innerHTML = '<div class="text-sm text-gray-500">等待操作...</div>';
        }

        // 模式切换
        function toggleMode() {
            const isRealMode = elements.modeToggle.querySelector('span').classList.contains('translate-x-6');
            
            if (!isRealMode) {
                // 切换到真实模式
                elements.modeToggle.classList.add('bg-green-600');
                elements.modeToggle.classList.remove('bg-gray-600');
                elements.modeToggle.querySelector('span').classList.add('translate-x-6');
                elements.modeToggle.querySelector('span').classList.remove('translate-x-1');
                elements.modeDescription.textContent = '当前：真实模式（连接树莓派）';
                elements.hardwareConfig.classList.remove('hidden');
                HAL.init('real');
                addLog('已切换到真实模式', 'info');
            } else {
                // 切换到模拟模式
                elements.modeToggle.classList.remove('bg-green-600');
                elements.modeToggle.classList.add('bg-gray-600');
                elements.modeToggle.querySelector('span').classList.remove('translate-x-6');
                elements.modeToggle.querySelector('span').classList.add('translate-x-1');
                elements.modeDescription.textContent = '当前：模拟模式（用于演示和测试）';
                elements.hardwareConfig.classList.add('hidden');
                HAL.init('simulation');
                addLog('已切换到模拟模式', 'info');
            }
        }

        // 手动测试手势识别
        function manualGestureTest() {
            const gestures = ['thumbs_up', 'open_palm', 'peace_sign', 'point_up'];
            const randomGesture = gestures[Math.floor(Math.random() * gestures.length)];
            const confidence = 0.8 + Math.random() * 0.2;
            
            const result = {
                gesture: randomGesture,
                confidence: confidence,
                timestamp: new Date().toISOString()
            };
            
            updateGestureDisplay(result, 150);
            addLog(`模拟手势: ${getGestureName(randomGesture)} (${(confidence * 100).toFixed(1)}%)`, 'info');
            
            // 如果置信度高，执行控制
            if (confidence > 0.7) {
                handleGestureCommand(randomGesture);
            }
        }

        // 事件监听器
        elements.startCamera.addEventListener('click', startCamera);
        elements.manualTest.addEventListener('click', manualGestureTest);
        elements.clearLogs.addEventListener('click', clearLogs);
        elements.modeToggle.addEventListener('click', toggleMode);
        elements.fanOn.addEventListener('click', () => executeFanControl('on', '手动启动'));
        elements.fanOff.addEventListener('click', () => executeFanControl('off', '手动停止'));

        // 初始化
        HAL.init('simulation');
        addLog('系统初始化完成', 'success');
        addLog('当前运行在模拟模式', 'info');
        
        // 定期更新风扇状态
        setInterval(async () => {
            if (HAL.mode === 'real') {
                try {
                    const status = await HAL.getFanStatus();
                    if (!status.error) {
                        updateFanDisplay(status.running);
                    }
                } catch (error) {
                    console.error('状态更新失败:', error);
                }
            }
        }, 5000);

        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            if (isStreamActive) {
                const stream = elements.videoElement.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            }
            if (recognitionInterval) {
                clearInterval(recognitionInterval);
            }
        });
    </script>
</body>
</html>
